[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
via_ir = true
optimizer_runs = 1
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]
fs_permissions = [{ access = "read", path = "/workspace/p10k-backtest" }, { access = "read", path = "./" }]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 64
fail_on_revert = false
